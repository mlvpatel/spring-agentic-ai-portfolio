server:
  port: 8084

spring:
  application:
    name: spec-orchestrator

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: false

info:
  app:
    name: spec-orchestrator

app:
  security:
    api-key: ${SPEC_ORCH_API_KEY:}
