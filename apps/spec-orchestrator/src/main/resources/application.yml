server:
  port: 8084

spring:
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    openai:
      api-key: ${OPENAI_API_KEY:}
  application:
    name: spec-orchestrator

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: false

info:
  app:
    name: spec-orchestrator

app:
  security:
    api-key: ${SPEC_ORCH_API_KEY:}
