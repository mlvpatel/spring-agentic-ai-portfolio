services:
  spec-orchestrator:
    image: eclipse-temurin:21-jre
    working_dir: /app
    volumes:
      - ./target/spec-orchestrator-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      SPEC_ORCH_API_KEY: ${SPEC_ORCH_API_KEY:-local-dev-only-change-me}
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8084:8084"
