server:
  port: 8081

spring:
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    openai:
      api-key: ${OPENAI_API_KEY:}
  application:
    name: yagni-copilot

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: false

info:
  app:
    name: yagni-copilot
    description: YAGNI coding copilot API

app:
  security:
    api-key: ${YAGNI_API_KEY:}
