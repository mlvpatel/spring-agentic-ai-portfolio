services:
  yagni-copilot:
    image: eclipse-temurin:21-jre
    working_dir: /app
    volumes:
      - ./target/yagni-copilot-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      YAGNI_API_KEY: ${YAGNI_API_KEY:-local-dev-only-change-me}
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8081:8081"
