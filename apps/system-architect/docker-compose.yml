services:
  system-architect:
    image: eclipse-temurin:21-jre
    working_dir: /app
    volumes:
      - ./target/system-architect-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      ARCHITECT_API_KEY: ${ARCHITECT_API_KEY:-local-dev-only-change-me}
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8089:8089"
