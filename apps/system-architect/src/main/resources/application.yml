server:
  port: 8089

spring:
  application:
    name: system-architect

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: false

info:
  app:
    name: system-architect

app:
  security:
    api-key: ${ARCHITECT_API_KEY:}
