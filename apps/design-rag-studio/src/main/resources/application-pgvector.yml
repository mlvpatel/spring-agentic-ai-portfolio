# Optional Postgres (compose --profile pgvector|postgres|prod → design-rag-db).
# Retrieval under this profile uses in-memory hashing embeddings + real cosine similarity.
# JDBC still stores tokens; Spring AI paid embeddings are not required for unit tests.
spring:
  datasource:
    url: ${DESIGN_RAG_JDBC_URL:jdbc:postgresql://localhost:5433/design}
    username: ${DESIGN_RAG_JDBC_USER:postgres}
    password: ${DESIGN_RAG_JDBC_PASSWORD:design}
    driver-class-name: org.postgresql.Driver

design:
  rag:
    vector-retrieval: true
