services:
  quality-gate:
    image: eclipse-temurin:21-jre
    working_dir: /app
    volumes:
      - ./target/quality-gate-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      QUALITY_GATE_API_KEY: ${QUALITY_GATE_API_KEY:-local-dev-only-change-me}
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8083:8083"
