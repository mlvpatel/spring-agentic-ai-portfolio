server:
  port: 8083

spring:
  application:
    name: quality-gate

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: false

info:
  app:
    name: quality-gate

app:
  security:
    api-key: ${QUALITY_GATE_API_KEY:}
