spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - ApiKeyAuth
            - RateLimiting

gateway:
  security:
    apiKey: test-gateway-api-key-for-unit-tests-only
  downstream:
    keys:
      yagni-copilot: test-yagni-downstream-key
  rateLimiter:
    replenishRate: 100
    burstCapacity: 200
