server:
  port: 8093

spring:
  application:
    name: ai-validated-integration-harness

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: false

info:
  app:
    name: ai-validated-integration-harness

app:
  security:
    api-key: ${AI_HARNESS_API_KEY:}
