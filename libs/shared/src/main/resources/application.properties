# Defaults for apps that depend on shared-lib + spring-ai-starter-model-openai.
# Offline unit tests stay green with an empty key and chat/embedding models none.
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.model.embedding=${SPRING_AI_MODEL_EMBEDDING:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
