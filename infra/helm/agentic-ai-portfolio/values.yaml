# Helm values for live apps/* (P1–P10). Pass secrets via --set or -f secrets.yaml (not committed).

global:
  environment: local
  springProfile: default
  imageRegistry: agentic-ai
  imagePullPolicy: IfNotPresent

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
  hosts:
    - host: agentic-ai.internal
      paths:
        - path: /
          pathType: Prefix
          serviceName: ai-edge-gateway
          servicePort: 8080
  tls:
    - secretName: agentic-ai-tls
      hosts:
        - agentic-ai.internal

monitoring:
  enabled: true
  prometheus:
    scrape: "true"
    path: "/actuator/prometheus"

# Required at install time (no chart defaults that look like real keys).
gatewaySecurityApiKey: ""
# Optional per-app API keys (empty allowed for offline paths).
apiKeys:
  yagni: ""
  designRag: ""
  qualityGate: ""
  specOrch: ""
  observability: ""
  mcpBroker: ""
  appFactory: ""
  paperLab: ""
  architect: ""

# Default single downstream for P10 (full P1–P9 route table is not wired yet).
gatewayDownstreamService: yagni-copilot
gatewayDownstreamPort: 8081

services:
  yagniCopilot:
    name: yagni-copilot
    apiKeyEnv: YAGNI_API_KEY
    apiKeyValueKey: yagni
    image:
      repository: yagni-copilot
      tag: 1.0.0-SNAPSHOT
    port: 8081
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 75
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1024Mi
    healthPath: /actuator/health

  designRagStudio:
