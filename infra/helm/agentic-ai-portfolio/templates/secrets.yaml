apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentic-ai-portfolio.fullname" . }}-secrets
  labels:
    {{- include "agentic-ai-portfolio.labels" . | nindent 4 }}
type: Opaque
stringData:
  GATEWAY_SECURITY_APIKEY: {{ required "gatewaySecurityApiKey must be set (no demo default)" .Values.gatewaySecurityApiKey | quote }}
  YAGNI_API_KEY: {{ .Values.apiKeys.yagni | quote }}
  DESIGN_RAG_API_KEY: {{ .Values.apiKeys.designRag | quote }}
  QUALITY_GATE_API_KEY: {{ .Values.apiKeys.qualityGate | quote }}
  SPEC_ORCH_API_KEY: {{ .Values.apiKeys.specOrch | quote }}
  OBSERVABILITY_API_KEY: {{ .Values.apiKeys.observability | quote }}
  MCP_BROKER_API_KEY: {{ .Values.apiKeys.mcpBroker | quote }}
  APP_FACTORY_API_KEY: {{ .Values.apiKeys.appFactory | quote }}
  PAPER_LAB_API_KEY: {{ .Values.apiKeys.paperLab | quote }}
  ARCHITECT_API_KEY: {{ .Values.apiKeys.architect | quote }}
