# Jar-mount profile for fast local iteration (use with docker-compose.yml).
# Example:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env up -d

x-jar-app: &jar-app
  image: eclipse-temurin:21-jre
  build: null
  working_dir: /app
  command: ["java", "-XX:MaxRAMPercentage=75.0", "-jar", "/app/app.jar"]

services:
  yagni-copilot:
    <<: *jar-app
    volumes:
      - ../../apps/yagni-copilot/target/yagni-copilot-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
  design-rag-studio:
    <<: *jar-app
    volumes:
      - ../../apps/design-rag-studio/target/design-rag-studio-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      DESIGN_RAG_SPRING_PROFILES: ""
      DESIGN_RAG_JDBC_URL: ""
  quality-gate:
    <<: *jar-app
    volumes:
      - ../../apps/quality-gate/target/quality-gate-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
  spec-orchestrator:
    <<: *jar-app
    volumes:
      - ../../apps/spec-orchestrator/target/spec-orchestrator-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
  agent-observability:
    <<: *jar-app
    volumes:
