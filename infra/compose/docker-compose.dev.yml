# Jar-mount profile for fast local iteration (use with docker-compose.yml).
# Example:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env up -d

services:
  yagni-copilot:
    image: eclipse-temurin:21-jre
    build: null
    working_dir: /app
    volumes:
      - ../../apps/yagni-copilot/target/yagni-copilot-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
  design-rag-studio:
    image: eclipse-temurin:21-jre
    build: null
    working_dir: /app
    volumes:
      - ../../apps/design-rag-studio/target/design-rag-studio-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      DESIGN_RAG_SPRING_PROFILES: ""
      DESIGN_RAG_JDBC_URL: ""
    command: ["java", "-jar", "/app/app.jar"]
